version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pneumovision_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/heatmaps:/app/backend/heatmaps
      - ./backend/reports:/app/backend/reports
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pneumovision_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
